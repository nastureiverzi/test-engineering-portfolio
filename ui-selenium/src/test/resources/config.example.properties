# Target web application URL
baseUrl=https://automationexercise.com

# Browser selection — options: CHROME, FIREFOX, EDGE
browser=CHROME

# Browser execution mode
headless=false

# Global explicit wait timeout in seconds
timeout=10

# Additional browser launch arguments, semicolon-separated (leave blank if none)
browser.args=none

# Domain used for dynamic test email generation
test.email.domain=example.com